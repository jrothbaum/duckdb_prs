site_name: duckdb_prs
site_description: DuckDB extension for reading SAS, Stata, and SPSS files.
repo_url: https://github.com/jrothbaum/duckdb_prs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
    - scheme: slate
      primary: indigo
      accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.tabs.link

markdown_extensions:
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Reading: read.md
  - Writing: write.md
  - Benchmarks: benchmarks.md
