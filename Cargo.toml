[package]
name = "read_prs"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[lib]
crate-type = ["cdylib"]

[profile.release]
strip = "symbols"

[dependencies]
duckdb-neo = { version = "0.20000", default-features = false, features = ["build-extension"] }
duckdb-loadable-macros = { version = "1.20000", features = ["neo"] }
polars-readstat-rs = "0.27.0"
arrow = { version = "60", features = ["ffi"] }
