name: Release

# Builds the extension on every platform and publishes a GitHub release with the binaries.
# It does not touch duckdb/community-extensions; PublishCommunityExtension does that, separately.
#
# Usage: bump `version` in description.yml, commit and push, then tag that commit:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: read_prs
      extra_toolchains: 'rust;python3'
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64_rtools;linux_amd64_musl'
      opt_in_archs: 'osx_amd64;windows_arm64'
      reduced_ci_mode: 'disabled'
      allow_failure_archs: 'windows_arm64'

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version in description.yml
        run: |
          version=$(sed -n 's/^  version: *\([^ #]*\).*/\1/p' description.yml | head -n1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match description.yml version ${version}"; exit 1
          fi

      - name: Download the built extensions
        uses: actions/download-artifact@v4
        with:
          pattern: read_prs-*-extension-*
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p dist
          for dir in artifacts/*/; do
            platform=$(basename "$dir" | sed 's/.*-extension-//')
            file=$(find "$dir" -name 'read_prs.duckdb_extension' | head -n1)
            [ -n "$file" ] || { echo "no extension file in $dir"; exit 1; }
            gzip -c "$file" > "dist/read_prs-${GITHUB_REF_NAME}-${platform}.duckdb_extension.gz"
          done
          ls -l dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Built for DuckDB v2.0.0 (C_STRUCT_UNSTABLE; load only on that exact DuckDB version)."
