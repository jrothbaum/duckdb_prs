name: Release

# Runs when you publish a release in the GitHub UI (or with `gh release create`): builds the extension
# on every platform and attaches the binaries to that release. It does not touch
# duckdb/community-extensions; PublishCommunityExtension does that, separately.
#
# Usage: bump `version` in description.yml, commit and push, then create a release whose tag is
# `v<version>` (for example v0.1.0) on that commit.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: read_prs
      extra_toolchains: 'rust;python3'
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64_rtools;linux_amd64_musl'
      opt_in_archs: 'osx_amd64;windows_arm64'
      reduced_ci_mode: 'disabled'
      allow_failure_archs: 'windows_arm64'

  attach:
    name: Attach binaries to the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check the tag matches the version in description.yml
        run: |
          version=$(sed -n 's/^  version: *\([^ #]*\).*/\1/p' description.yml | head -n1)
          if [ "${TAG}" != "v${version}" ]; then
            echo "release tag ${TAG} does not match description.yml version ${version}"; exit 1
          fi

      - name: Download the built extensions
        uses: actions/download-artifact@v4
        with:
          pattern: read_prs-*-extension-*
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p dist
          for dir in artifacts/*/; do
            platform=$(basename "$dir" | sed 's/.*-extension-//')
            file=$(find "$dir" -name 'read_prs.duckdb_extension' | head -n1)
            [ -n "$file" ] || { echo "no extension file in $dir"; exit 1; }
            gzip -c "$file" > "dist/read_prs-${TAG}-${platform}.duckdb_extension.gz"
          done
          ls -l dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" dist/* --clobber
